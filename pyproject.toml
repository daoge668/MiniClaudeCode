[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-claude-code"
version = "1.0.0"
description = "A modular command-line coding agent powered by the Anthropic API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
mini-claude-code = "mini_claude_code.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_claude_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
